<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВкусноДом — домашние рецепты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ВкусноДом</h1>
    <p>24 проверенных домашних рецепта</p>
  </header>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Поиск рецепта (название, ингредиент)...">
    <div id="filters" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
  </div>

  <main>
    <div id="recipes-grid" class="recipes-grid"></div>
    <div id="no-results" style="display:none; text-align:center; padding:40px; color:#888;">Ничего не найдено. Попробуйте другой запрос.</div>
    <div id="data-warning" style="display:none; text-align:center; padding:40px; color:#888;">Не удалось загрузить рецепты. Проверьте файл data.js.</div>
  </main>

  <!-- Список покупок -->
  <div id="shopping-list-container">
    <div class="sl-header">
      <span>Список покупок (<span id="sl-count">0</span>)</span>
      <button id="sl-close-btn" title="Свернуть">&times;</button>
    </div>
    <ul id="shopping-list"></ul>
    <div class="sl-actions">
      <button id="sl-copy-btn">Копировать</button>
      <button id="sl-clear-btn">Очистить</button>
    </div>
  </div>
  <button id="sl-toggle-btn">Список покупок: <span id="sl-count-btn">0</span></button>

  <script src="data.js"></script>
  <script>
  (function () {
    var RECIPE_FOLDER = 'recipe';
    var STORAGE_KEY = 'vkusnodom_shopping_list';

    function findRecipes() {
      var names = ['recipes', 'RECIPES', 'data', 'recipesData', 'recipesList', 'dishes', 'menu'];
      for (var i = 0; i < names.length; i++) {
        var v = window[names[i]];
        if (Array.isArray(v) && v.length > 0 && typeof v === 'object') return v;
      }
      return null;
    }

    function pick(obj, keys) {
      for (var i = 0; i < keys.length; i++) {
        if (obj[keys[i]] !== undefined && obj[keys[i]] !== null && obj[keys[i]] !== '') return obj[keys[i]];
      }
      return null;
    }

    function getIngredients(r) {
      var ing = pick(r, ['ingredients', 'ingredient', 'ing', 'products', 'ингредиенты']);
      if (Array.isArray(ing)) return ing.map(String);
      if (typeof ing === 'string' && ing.trim()) {
        return ing.split(/[,;\n]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      }
      return ;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var recipes = findRecipes();
    var grid = document.getElementById('recipes-grid');
    var searchInput = document.getElementById('search-input');
    var filtersBox = document.getElementById('filters');
    var noResults = document.getElementById('no-results');
    var dataWarning = document.getElementById('data-warning');
    var activeFilter = 'Все';

    if (!recipes) {
      dataWarning.style.display = 'block';
      return;
    }

    function buildFilters() {
      var cats = ;
      recipes.forEach(function (r) {
        var c = pick(r, ['category', 'cat', 'type', 'категория', 'раздел']);
        if (c && cats.indexOf(String(c)) === -1) cats.push(String(c));
      });
      var list = ['Все'].concat(cats);
      filtersBox.innerHTML = '';
      list.forEach(function (cat) {
        var btn = document.createElement('button');
        btn.className = 'filter-btn' + (cat === activeFilter ? ' active' : '');
        btn.textContent = cat;
        btn.addEventListener('click', function () {
          activeFilter = cat;
          var all = filtersBox.querySelectorAll('.filter-btn');
          for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
          btn.classList.add('active');
          renderGrid();
        });
        filtersBox.appendChild(btn);
      });
    }

    function renderGrid() {
      var q = (searchInput.value || '').toLowerCase().trim();
      grid.innerHTML = '';
      var shown = 0;

      recipes.forEach(function (r) {
        var title = String(pick(r, ['title', 'name', 'dish', 'название']) || 'Рецепт');
        var time = pick(r, ['time', 'minutes', 'время']);
        var cat = pick(r, ['category', 'cat', 'type', 'категория']);
        var img = pick(r, ['image', 'img', 'photo', 'картинка']);
        var ing = getIngredients(r);

        var matchQ = !q || title.toLowerCase().indexOf(q) !== -1 ||
          ing.join(' ').toLowerCase().indexOf(q) !== -1;
        var matchC = activeFilter === 'Все' || (cat && String(cat) === activeFilter);
        if (!matchQ || !matchC) return;
        shown++;

        var card = document.createElement('a');
        card.className = 'recipe-card';

        var slug = title.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
        card.href = RECIPE_FOLDER + '/' + slug + '.html';

        var imgHtml;
        if (img) {
          imgHtml = '<img class="card-img" src="' + escapeHtml(img) + '" alt="' + escapeHtml(title) + '">';
        } else {
          imgHtml = '<div class="card-img"></div>';
        }

        card.innerHTML = imgHtml +
          '<div class="card-body">' +
            '<h3 class="card-title">' + escapeHtml(title) + '</h3>' +
            '<div class="card-meta">' + escapeHtml(cat ? cat : '') + (time ? ' • ' + escapeHtml(time) : '') +
              (ing.length ? ' • ' + ing.length + ' ингр.' : '') + '</div>' +
          '</div>';

        var btn = document.createElement('button');
        btn.className = 'sl-add-btn';
        btn.textContent = 'В список покупок';
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var items = ing.length ? ing : [title + ' (ингредиенты)'];
          var added = 0;
          items.forEach(function (x) {
            if (addItem(x)) added++;
          });
          btn.textContent = 'Добавлено: ' + added;
          btn.classList.add('sl-added');
          setTimeout(function () {
            btn.textContent = 'В список покупок';
            btn.classList.remove('sl-added');
          }, 1500);
        });
        card.querySelector('.card-body').appendChild(btn);

        grid.appendChild(card);
      });

      noResults.style.display = shown === 0 ? 'block' : 'none';
    }

    function getList() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : ;
      } catch (e) { return ; }
    }
    function saveList(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      updateCounts();
    }
    function addItem(item) {
      var list = getList();
      if (list.indexOf(item) !== -1) return false;
      list.push(item);
      saveList(list);
      return true;
    }
    function removeFromList(index) {
      var list = getList();
      list.splice(index, 1);
      saveList(list);
      renderList();
    }
    function updateCounts() {
      var n = getList().length;
      document.getElementById('sl-count').textContent = n;
      document.getElementById('sl-count-btn').textContent = n;
      document.getElementById('sl-toggle-btn').style.display = n > 0 ? 'block' : 'none';
      document.getElementById('shopping-list-container').style.display = n > 0 ? 'block' : 'none';
    }
    function renderList() {
      var list = getList();
      var ul = document.getElementById('shopping-list');
      ul.innerHTML = '';
      list.forEach(function (item, i) {
        var li = document.createElement('li');
        var span = document.createElement('span');
        span.textContent = item;
        var del = document.createElement('button');
        del.textContent = '×';
        del.addEventListener('click', function () { removeFromList(i); });
        li.appendChild(span);
        li.appendChild(del);
        ul.appendChild(li);
      });
      updateCounts();
    }

    document.getElementById('sl-clear-btn').addEventListener('click', function () {
      saveList();
      renderList();
    });
    document.getElementById('sl-copy-btn').addEventListener('click', function () {
      var text = getList().map(function (i, n) { return (n + 1) + '. ' + i; }).join('\n');
      navigator.clipboard.writeText(text).then(function () {
        var b = document.getElementById('sl-copy-btn');
        b.textContent = 'Скопировано!';
        setTimeout(function () { b.textContent = 'Копировать'; }, 1500);
      });
    });
    document.getElementById('sl-close-btn').addEventListener('click', function () {
      document.getElementById('shopping-list-container').style.display = 'none';
      document.getElementById('sl-toggle-btn').style.display = 'block';
    });
    document.getElementById('sl-toggle-btn').addEventListener('click', function () {
      document.getElementById('shopping-list-container').style.display = 'block';
      document.getElementById('sl-toggle-btn').style.display = 'none';
    });

    searchInput.addEventListener('input', renderGrid);

    buildFilters();
    renderGrid();
    renderList();
  })();
  </script>
</body>
</html>
